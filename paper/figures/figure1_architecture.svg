<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Reduced-scale Agentopia architecture on consumer hardware</title>
  <desc id="desc">A three-band architecture diagram showing the inference backend, weekly simulation loop, and layered memory, four-block daily time, and explicit health adaptations.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2F6B9A"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#247A62"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#A26316"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#B5473E"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #1D2939; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #667085; }
      .band-label { font: 700 19px Arial, Helvetica, sans-serif; fill: #475467; }
      .box-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #1D2939; }
      .box-copy { font: 400 18px Arial, Helvetica, sans-serif; fill: #475467; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #667085; }
      .small-strong { font: 700 14px Arial, Helvetica, sans-serif; fill: #344054; }
      .chip { font: 700 13px Arial, Helvetica, sans-serif; fill: #344054; }
      .module-title { font: 700 22px Arial, Helvetica, sans-serif; }
      .flow { fill: none; stroke: #344054; stroke-width: 2.4; marker-end: url(#arrow); }
      .control { fill: none; stroke-width: 2.2; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#FFFFFF"/>

  <text x="800" y="43" text-anchor="middle" class="title">Reduced-Scale Agentopia on Consumer Hardware</text>
  <text x="800" y="70" text-anchor="middle" class="subtitle">Five active agents | one apartment world | target horizon: 52 simulated weeks</text>

  <!-- Band 1: inference backend -->
  <text x="48" y="110" class="band-label">INFERENCE BACKEND</text>
  <line x1="48" y1="120" x2="1552" y2="120" stroke="#D0D5DD" stroke-width="1.5"/>

  <rect x="170" y="140" width="310" height="88" rx="6" fill="#EEF4F8" stroke="#2F6B9A" stroke-width="2"/>
  <text x="325" y="174" text-anchor="middle" class="box-title">Consumer GPU</text>
  <text x="325" y="201" text-anchor="middle" class="box-copy">RTX 5070 Ti Laptop | 12 GB VRAM</text>

  <rect x="645" y="140" width="310" height="88" rx="6" fill="#EEF4F8" stroke="#2F6B9A" stroke-width="2"/>
  <text x="800" y="174" text-anchor="middle" class="box-title">vLLM Serving</text>
  <text x="800" y="199" text-anchor="middle" class="box-copy">24,576-token server limit</text>
  <text x="800" y="218" text-anchor="middle" class="small">one request at a time</text>

  <rect x="1120" y="140" width="310" height="88" rx="6" fill="#EEF4F8" stroke="#2F6B9A" stroke-width="2"/>
  <text x="1275" y="174" text-anchor="middle" class="box-title">Qwen3-8B-AWQ</text>
  <text x="1275" y="199" text-anchor="middle" class="box-copy">4-bit shared inference model</text>
  <text x="1275" y="218" text-anchor="middle" class="small">Role-agent and God-model calls</text>

  <path d="M480 184 H645" class="flow" style="stroke:#2F6B9A; marker-end:url(#arrow-blue)"/>
  <path d="M955 184 H1120" class="flow" style="stroke:#2F6B9A; marker-end:url(#arrow-blue)"/>

  <!-- Band 2: weekly simulation loop -->
  <text x="48" y="285" class="band-label">AGENTOPIA WEEKLY LOOP</text>
  <line x1="48" y1="295" x2="1552" y2="295" stroke="#D0D5DD" stroke-width="1.5"/>

  <rect x="70" y="330" width="238" height="120" rx="6" fill="#F8FAFC" stroke="#667085" stroke-width="2"/>
  <text x="189" y="370" text-anchor="middle" class="box-title">1. Plan</text>
  <text x="189" y="397" text-anchor="middle" class="box-copy">Weekly goals and</text>
  <text x="189" y="418" text-anchor="middle" class="box-copy">daily schedule</text>

  <rect x="375" y="330" width="238" height="120" rx="6" fill="#F8FAFC" stroke="#667085" stroke-width="2"/>
  <text x="494" y="358" text-anchor="middle" class="box-title">2. Contact &amp;</text>
  <text x="494" y="382" text-anchor="middle" class="box-title">Schedule</text>
  <text x="494" y="408" text-anchor="middle" class="box-copy">Social decisions and</text>
  <text x="494" y="429" text-anchor="middle" class="box-copy">schedule confirmation</text>

  <rect x="680" y="316" width="260" height="148" rx="6" fill="#FFF7E8" stroke="#A26316" stroke-width="2.4"/>
  <text x="810" y="349" text-anchor="middle" class="box-title">3. Activity</text>
  <text x="810" y="374" text-anchor="middle" class="small">four blocks per simulated day</text>
  <rect x="696" y="395" width="45" height="44" rx="4" fill="#FFFFFF" stroke="#D7A44A"/>
  <rect x="746" y="395" width="55" height="44" rx="4" fill="#FFFFFF" stroke="#D7A44A"/>
  <rect x="806" y="395" width="65" height="44" rx="4" fill="#FFFFFF" stroke="#D7A44A"/>
  <rect x="876" y="395" width="53" height="44" rx="4" fill="#FFFFFF" stroke="#D7A44A"/>
  <text x="718.5" y="421" text-anchor="middle" class="chip">Night</text>
  <text x="773.5" y="421" text-anchor="middle" class="chip">Morning</text>
  <text x="838.5" y="421" text-anchor="middle" class="chip">Afternoon</text>
  <text x="902.5" y="421" text-anchor="middle" class="chip">Evening</text>

  <rect x="1007" y="330" width="238" height="120" rx="6" fill="#F8FAFC" stroke="#667085" stroke-width="2"/>
  <text x="1126" y="370" text-anchor="middle" class="box-title">4. Review</text>
  <text x="1126" y="397" text-anchor="middle" class="box-copy">Reflection over</text>
  <text x="1126" y="418" text-anchor="middle" class="box-copy">weekly experience</text>

  <rect x="1312" y="330" width="238" height="120" rx="6" fill="#F8FAFC" stroke="#667085" stroke-width="2"/>
  <text x="1431" y="370" text-anchor="middle" class="box-title">5. Settlement</text>
  <text x="1431" y="397" text-anchor="middle" class="box-copy">Rewards, state updates,</text>
  <text x="1431" y="418" text-anchor="middle" class="box-copy">and weekly checkpoint</text>

  <path d="M308 390 H375" class="flow"/>
  <path d="M613 390 H680" class="flow"/>
  <path d="M940 390 H1007" class="flow"/>
  <path d="M1245 390 H1312" class="flow"/>
  <path d="M1431 450 V500 H189 V450" class="flow"/>
  <text x="810" y="522" text-anchor="middle" class="small">advance to the next simulated week</text>

  <path d="M1275 228 V265 H810 V305" class="control" stroke="#2F6B9A" marker-end="url(#arrow-blue)"/>
  <text x="1050" y="258" text-anchor="middle" class="small" fill="#2F6B9A">LLM-mediated Role and God operations</text>

  <!-- Band 3: structural adaptations -->
  <text x="48" y="570" class="band-label">STRUCTURAL ADAPTATIONS</text>
  <line x1="48" y1="580" x2="1552" y2="580" stroke="#D0D5DD" stroke-width="1.5"/>

  <!-- Memory -->
  <rect x="48" y="604" width="620" height="250" rx="6" fill="#F0F8F5" stroke="#247A62" stroke-width="2.2"/>
  <text x="76" y="638" class="module-title" fill="#247A62">M | System-Managed Layered Memory</text>

  <rect x="78" y="674" width="160" height="92" rx="5" fill="#FFFFFF" stroke="#58A68E" stroke-width="1.8"/>
  <text x="158" y="705" text-anchor="middle" class="box-title">L1</text>
  <text x="158" y="726" text-anchor="middle" class="box-copy">Complete</text>
  <text x="158" y="746" text-anchor="middle" class="box-copy">event logs</text>
  <text x="158" y="762" text-anchor="middle" class="small">recent 1--5 weeks</text>

  <rect x="278" y="674" width="160" height="92" rx="5" fill="#FFFFFF" stroke="#58A68E" stroke-width="1.8"/>
  <text x="358" y="705" text-anchor="middle" class="box-title">L2</text>
  <text x="358" y="730" text-anchor="middle" class="box-copy">God summaries</text>
  <text x="358" y="751" text-anchor="middle" class="small">6--20 weeks old</text>

  <rect x="478" y="674" width="160" height="92" rx="5" fill="#FFFFFF" stroke="#58A68E" stroke-width="1.8"/>
  <text x="558" y="705" text-anchor="middle" class="box-title">L3</text>
  <text x="558" y="730" text-anchor="middle" class="box-copy">Milestones</text>
  <text x="558" y="751" text-anchor="middle" class="small">21+ weeks old</text>

  <path d="M238 720 H278" class="control" stroke="#247A62" marker-end="url(#arrow-green)"/>
  <path d="M438 720 H478" class="control" stroke="#247A62" marker-end="url(#arrow-green)"/>
  <text x="358" y="800" text-anchor="middle" class="box-copy">Eligible L1/L2/L3 context is injected into Plan and Review</text>
  <text x="358" y="826" text-anchor="middle" class="small">compression is performed by God-model calls</text>

  <!-- Time -->
  <rect x="692" y="604" width="300" height="250" rx="6" fill="#FFF7E8" stroke="#A26316" stroke-width="2.2"/>
  <text x="720" y="638" class="module-title" fill="#A26316">T | Four-Block Day</text>
  <rect x="723" y="674" width="238" height="66" rx="5" fill="#FFFFFF" stroke="#D7A44A" stroke-width="1.8"/>
  <text x="842" y="701" text-anchor="middle" class="box-copy">Night | Morning</text>
  <text x="842" y="725" text-anchor="middle" class="box-copy">Afternoon | Evening</text>
  <path d="M842 740 V780" class="control" stroke="#A26316" marker-end="url(#arrow-amber)"/>
  <text x="842" y="807" text-anchor="middle" class="box-copy">Agent-selected activity or rest</text>
  <text x="842" y="829" text-anchor="middle" class="small">reuses the existing daily control flow</text>
  <path d="M842 604 V474" class="control" stroke="#A26316" marker-end="url(#arrow-amber)"/>

  <!-- Health -->
  <rect x="1016" y="604" width="536" height="250" rx="6" fill="#FFF2F0" stroke="#B5473E" stroke-width="2.2"/>
  <text x="1044" y="638" class="module-title" fill="#B5473E">H | Explicit Health State</text>

  <rect x="1046" y="674" width="140" height="72" rx="5" fill="#FFFFFF" stroke="#D07870" stroke-width="1.8"/>
  <text x="1116" y="698" text-anchor="middle" class="box-copy">Activity</text>
  <text x="1116" y="718" text-anchor="middle" class="box-copy">outcomes</text>
  <text x="1116" y="738" text-anchor="middle" class="small">and event logs</text>

  <rect x="1214" y="674" width="150" height="72" rx="5" fill="#FFFFFF" stroke="#D07870" stroke-width="1.8"/>
  <text x="1289" y="702" text-anchor="middle" class="box-copy">God-evaluated</text>
  <text x="1289" y="726" text-anchor="middle" class="small">weekly deltas</text>

  <rect x="1392" y="674" width="130" height="72" rx="5" fill="#FFFFFF" stroke="#D07870" stroke-width="1.8"/>
  <text x="1457" y="702" text-anchor="middle" class="box-title">PH / MH</text>
  <text x="1457" y="726" text-anchor="middle" class="small">0--100 state</text>

  <path d="M1186 710 H1214" class="control" stroke="#B5473E" marker-end="url(#arrow-red)"/>
  <path d="M1364 710 H1392" class="control" stroke="#B5473E" marker-end="url(#arrow-red)"/>
  <text x="1284" y="787" text-anchor="middle" class="box-copy">Health-aware prompts feed Plan and Review</text>
  <text x="1284" y="812" text-anchor="middle" class="small">Warning: MH &lt;= 20 or PH &lt;= 10</text>
  <text x="1284" y="834" text-anchor="middle" class="small">Physical death check: PH &lt; 10 for 3 or 5 weeks, by social-seeking branch</text>

  <path d="M1284 604 V540 H1431 V460" class="control" stroke="#B5473E" marker-end="url(#arrow-red)"/>
  <text x="1358" y="558" text-anchor="middle" class="small" fill="#B5473E">weekly health update and threshold checks</text>

  <!-- Legend -->
  <path d="M1110 891 H1160" class="flow"/>
  <text x="1172" y="896" class="small">simulation flow</text>
  <path d="M1310 891 H1360" class="control" stroke="#667085" marker-end="url(#arrow)"/>
  <text x="1372" y="896" class="small">context or control path</text>
</svg>
